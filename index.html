<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>3D Model Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none; /* Prevents pull-to-refresh & browser scrolling on Android */
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121214;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e2026 0%, #0c0d11 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.08);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .progress-track {
      width: min(280px, 80vw);
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      transition: width 0.2s ease;
      border-radius: 999px;
    }
    #progress-text {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    #top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .control-cluster {
      display: flex;
      gap: 7px;
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(18, 22, 30, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 9px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    .btn:hover {
      background: rgba(30, 38, 52, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.5);
    }

    /* Bottom Reset Button */
    #bottom-right-bar {
      position: absolute;
      bottom: 20px;
      right: 16px;
      z-index: 10;
      pointer-events: auto;
    }

    #touch-sensor-card {
      position: absolute;
      bottom: 20px;
      left: 16px;
      max-width: calc(100vw - 120px);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .touch-sensor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .touch-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .status-dot.active {
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
      transform: scale(1.35);
    }
    .touch-dismiss-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .touch-dismiss-btn:hover {
      color: #f1f5f9;
    }
    .touch-instructions {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .touch-active-state {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      min-height: 15px;
      transition: opacity 0.2s;
    }
  </style>

  <!-- ES Module Polyfill and CDN mappings -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Loading Screen (Pure percentage / progress, no MB/KB size revealed) -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="progress-track">
      <div id="progress-bar"></div>
    </div>
    <span id="progress-text">Preparing 3D environment...</span>
  </div>

  <div id="top-bar">
    <!-- Background Scene Selector -->
    <div class="control-cluster" id="bg-controls">
      <button class="btn active" id="btn-dark">🌑 Dark</button>
      <button class="btn" id="btn-sky">🌤️ Sky</button>
      <button class="btn" id="btn-sunset">🌅 Sunset</button>
      <button class="btn" id="btn-clean">⚪ Light</button>
    </div>

    <!-- Auto-Rotate toggle -->
    <div class="control-cluster">
      <button class="btn" id="btn-autorotate">⟳ Auto-Rotate: OFF</button>
    </div>
  </div>

  <!-- Touch Notification & Gesture Feedback Widget -->
  <div id="touch-sensor-card">
    <div class="touch-sensor-header">
      <div class="touch-status-badge">
        <span class="status-dot" id="touch-dot"></span>
        <span id="sensor-state-title">Touch Controls Active</span>
      </div>
      <button class="touch-dismiss-btn" id="btn-dismiss-sensor" title="Dismiss">×</button>
    </div>
    <div class="touch-instructions">
      • 1 Finger: Orbit &amp; Rotate<br>
      • 2 Fingers: Pinch to Zoom &amp; Pan
    </div>
    <div class="touch-active-state" id="touch-live-status">Gesture: Standby (Touch Ready)</div>
  </div>

  <!-- Bottom Reset View Button -->
  <div id="bottom-right-bar">
    <button class="btn" id="btn-reset">↺ Reset</button>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // 1. Scene, Camera, and High-Performance Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121214);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 2. Mobile-Friendly OrbitControls with Touch Mapping
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 2.0;

    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // 3. Dedicated Studio Lighting Rig
    const studioLights = new THREE.Group();
    
    // Balanced hemisphere ambient light
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 1.4);
    hemiLight.position.set(0, 20, 0);
    studioLights.add(hemiLight);

    // Key directional light for crisp highlights
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(6, 12, 8);
    studioLights.add(keyLight);

    // Fill directional light to soften shadows
    const fillLight = new THREE.DirectionalLight(0xe2e8f0, 1.1);
    fillLight.position.set(-6, 6, -6);
    studioLights.add(fillLight);

    // Rim light for edge separation
    const rimLight = new THREE.DirectionalLight(0x94a3b8, 0.8);
    rimLight.position.set(0, -6, -8);
    studioLights.add(rimLight);

    scene.add(studioLights);

    function createGradientTexture(topColor, bottomColor) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, topColor);
      gradient.addColorStop(1, bottomColor);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 16, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      return texture;
    }

    const bgTextures = {
      sky: createGradientTexture('#0284c7', '#e0f2fe'),
      sunset: createGradientTexture('#311042', '#f97316')
    };

    function applyBackgroundPreset(preset) {
      if (preset === 'dark') {
        scene.background = new THREE.Color(0x121214);
      } else if (preset === 'sky') {
        scene.background = bgTextures.sky;
      } else if (preset === 'sunset') {
        scene.background = bgTextures.sunset;
      } else if (preset === 'clean') {
        scene.background = new THREE.Color(0xf1f5f9);
      }
    }

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    const MODEL_PATH = './3DModel-v1.glb';
    const initialCamState = { pos: new THREE.Vector3(), target: new THREE.Vector3() };

    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const overlay = document.getElementById('loading-overlay');

    gltfLoader.load(
      MODEL_PATH,
      (gltf) => {
        const model = gltf.scene;

        // Auto-center model at world origin
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.x += (model.position.x - center.x);
        model.position.y += (model.position.y - center.y);
        model.position.z += (model.position.z - center.z);

        scene.add(model);

        // Frame camera automatically to model bounding box
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = camera.fov * (Math.PI / 180);
        let cameraDist = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.55;

        camera.position.set(0, maxDim * 0.45, cameraDist);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);

        initialCamState.pos.copy(camera.position);
        initialCamState.target.copy(controls.target);

        // Smooth transition after loading completes
        progressBar.style.width = '100%';
        progressText.innerText = 'Ready!';
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
      },
      (xhr) => {
        // STRICT REQUIREMENT: Only percentage displayed, NO MB/KB size revealed
        if (xhr.lengthComputable && xhr.total > 0) {
          const percent = Math.min(Math.round((xhr.loaded / xhr.total) * 100), 99);
          progressBar.style.width = percent + '%';
          progressText.innerText = `Loading 3D Model... ${percent}%`;
        } else {
          // Fallback animation when length is uncomputable
          progressText.innerText = 'Loading 3D Model...';
          progressBar.style.width = '70%';
        }
      },
      (error) => {
        console.error('Error loading model:', error);
        progressText.innerText = 'Unable to load model. Verify file path.';
        progressText.style.color = '#ef4444';
      }
    );

    const touchDot = document.getElementById('touch-dot');
    const touchLiveStatus = document.getElementById('touch-live-status');
    const touchSensorCard = document.getElementById('touch-sensor-card');

    window.addEventListener('touchstart', (e) => {
      touchDot.classList.add('active');
      if (e.touches.length === 1) {
        touchLiveStatus.innerText = 'Gesture: 1-Finger Orbiting';
      } else if (e.touches.length === 2) {
        touchLiveStatus.innerText = 'Gesture: 2-Finger Zoom / Pan';
      } else {
        touchLiveStatus.innerText = `Gesture: Multi-Touch (${e.touches.length} fingers)`;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        touchDot.classList.remove('active');
        touchLiveStatus.innerText = 'Gesture: Standby (Touch Ready)';
      } else if (e.touches.length === 1) {
        touchLiveStatus.innerText = 'Gesture: 1-Finger Orbiting';
      }
    }, { passive: true });

    document.getElementById('btn-dismiss-sensor').addEventListener('click', () => {
      touchSensorCard.style.opacity = '0';
      touchSensorCard.style.transform = 'translateY(10px)';
      setTimeout(() => { touchSensorCard.style.display = 'none'; }, 300);
    });

    // Auto-Rotate Button
    const btnAutoRotate = document.getElementById('btn-autorotate');
    btnAutoRotate.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      if (controls.autoRotate) {
        btnAutoRotate.classList.add('active');
        btnAutoRotate.innerText = '⟳ Auto-Rotate: ON';
      } else {
        btnAutoRotate.classList.remove('active');
        btnAutoRotate.innerText = '⟳ Auto-Rotate: OFF';
      }
    });

    // Background Scene Preset Buttons
    const bgButtons = [
      { id: 'btn-dark', type: 'dark' },
      { id: 'btn-sky', type: 'sky' },
      { id: 'btn-sunset', type: 'sunset' },
      { id: 'btn-clean', type: 'clean' }
    ];

    bgButtons.forEach(({ id, type }) => {
      const button = document.getElementById(id);
      button.addEventListener('click', () => {
        bgButtons.forEach(b => document.getElementById(b.id).classList.remove('active'));
        button.classList.add('active');
        applyBackgroundPreset(type);
      });
    });

    // Reset View Button
    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.copy(initialCamState.pos);
      controls.target.copy(initialCamState.target);
      controls.update();
    });

    // 7. Responsive Viewport Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 8. Animation Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
